# Культовые реплики персонажей для команд (только VIP, модераторы, стример):
#   !tts брайер          — Брайер говорит случайную свою реплику
#   !tts брайер: текст   — ваш текст голосом Брайер (работает с любым персонажем из voices/)
#   !tts фраза           — случайный персонаж говорит свою реплику
# Ключ — имя папки в voices/. aliases — как ещё можно назвать персонажа в команде.
# Дописывайте свои реплики — бот перечитывает файл при запуске.

[briar]
aliases = ["брайер", "briar"]
phrases = [
  "Вся эта кровь мне-е-е-е!",
  "КРОООВЬ!",
  "Приятно познакомиться, я голодна… то есть, Брайер!",
  "Ааа… Это называется «стратегия», да?",
  "Помни. У тебя есть выбор. Ты можешь держать себя в руках. У тебя… есть… выбор.",
  "Так-так. Сегодня я заберусь на дерево, выучу гимн Ноксуса, убью врагов и… рассмешу ребёнка!",
  "Так… значит, можно пойти туда, туда или туда…",
  "Чью кровь мы сегодня прольём? То есть, попьём. Или разделим? Что ещё делают с кровью?",
]

[arthas]
aliases = ["артас", "arthas"]
phrases = [
  "Фростморн жаждет крови!",
  "Ради Лордерона!",
  "Я сделаю всё, чтобы спасти свой народ.",
]

[illidan]
aliases = ["иллидан", "илидан", "illidan"]
phrases = [
  "Вы не готовы!",
  "Я был заточён десять тысяч лет!",
]

[vaas]
aliases = ["ваас", "вас", "vaas"]
phrases = [
  "Я уже говорил тебе, что такое безумие?",
  "Безумие — это точное повторение одного и того же действия. Раз за разом, в надежде на изменение.",
]

[johnny]
aliases = ["джонни", "сильверхенд", "johnny"]
phrases = [
  "Проснись, самурай! Нам ещё город сжигать.",
]

[sidorovich]
aliases = ["сидорович", "сидор"]
phrases = [
  "Короче, Меченый, я тебя спас и в благородство играть не буду.",
  "Что за бадягу ты мне приволок?",
]

[geralt]
aliases = ["геральт", "geralt"]
phrases = [
  "Зараза.",
  "Ветер воет.",
]

[cain]
aliases = ["каин", "декард", "cain"]
phrases = [
  "Остановись и послушай!",
]
